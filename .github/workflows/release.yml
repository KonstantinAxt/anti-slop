name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-assets:
    name: Publish Release Assets
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup and build
        uses: ./.github/actions/setup-build

      - name: Package tarball and checksums
        run: |
          mkdir -p release-dist
          tar --exclude='./.git' \
              --exclude='./node_modules' \
              --exclude='./e2e-fixtures' \
              --exclude='./reports' \
              --exclude='./coverage' \
              --exclude='./release-dist' \
              -czf release-dist/anti-slop.tgz .

          cd release-dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum anti-slop.tgz > checksums.txt
          else
            shasum -a 256 anti-slop.tgz > checksums.txt
          fi

      - name: Upload release assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            release-dist/anti-slop.tgz \
            release-dist/checksums.txt \
            --clobber
